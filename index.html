<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مختبر الروابط الكيميائية | Chemical Bond Lab</title>
<style>
:root{--ink:#082f49;--blue:#0891b2;--gold:#fbbf24;--pink:#f43f5e;--green:#10b981;--paper:#f4fbfd;--line:#bfe3eb;--muted:#55727d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 5%,#cffafe 0,transparent 28%),radial-gradient(circle at 92% 92%,#fef3c7 0,transparent 30%),var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif;min-height:100vh}button{font:inherit}.app{width:min(1100px,calc(100% - 22px));margin:auto;padding:15px 0 28px}.hero{background:linear-gradient(135deg,#062f43,#087d99);color:#fff;border-radius:24px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 16px 44px #075b7728}.hero h1{margin:2px 0;font-size:clamp(25px,4vw,42px)}.hero p{margin:3px 0;color:#d8f8ff}.tools{display:flex;gap:8px;flex-wrap:wrap}.glass{border:1px solid #ffffff66;background:#ffffff18;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.progress{height:12px;background:#d8edf2;border-radius:99px;overflow:hidden;margin:15px 2px}.progress span{display:block;height:100%;width:12.5%;background:linear-gradient(90deg,var(--gold),var(--pink));transition:.5s}.card{background:#ffffffed;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 46px #075b771a;overflow:hidden}.stage{padding:24px;min-height:590px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;color:#0783a0}.stage h2{font-size:clamp(25px,3vw,38px);margin:8px 0}.lead{color:var(--muted);font-size:17px;line-height:1.8;margin:7px 0 18px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.panel{border:2px solid var(--line);border-radius:20px;background:#fff;padding:18px}.panel h3{margin:0 0 10px}.callout{border-inline-start:5px solid var(--blue);background:#e6faff;padding:13px 15px;border-radius:14px;line-height:1.7}.nav{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:14px 18px;background:#fbfeff}.nav button,.primary{border:0;border-radius:13px;padding:11px 20px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--blue),#05708c);color:#fff}.nav button:disabled{opacity:.35}.count{font-weight:900;color:var(--muted)}
.atomScene{height:330px;position:relative;border-radius:20px;overflow:hidden;background:radial-gradient(circle,#f8ffff 0,#d7f2f7 65%,#cae9ef);display:flex;align-items:center;justify-content:center;gap:115px}.atom{position:relative;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:25px;z-index:5;background:radial-gradient(circle at 35% 30%,#37d9ef,#056984 72%);box-shadow:inset -12px -12px 25px #003d5a55,0 12px 24px #07556f2d}.atom.pink{background:radial-gradient(circle at 35% 30%,#ff9bb0,#b32249 72%)}.cloud{position:absolute;width:210px;height:210px;border-radius:50%;opacity:.9;background:radial-gradient(circle,#fff8a8 0 6%,#ffe14fbb 11%,#3fd4e166 32%,#3fd4e122 50%,transparent 70%);animation:breathe 2.2s ease-in-out infinite}.cloud.left{left:16%}.cloud.right{right:16%;animation-delay:-1.1s}.cloud.shared{left:50%;transform:translateX(-50%);width:250px;background:radial-gradient(ellipse,#fff5a0 0 10%,#ffe14fd9 17%,#a45cf55e 36%,transparent 70%);animation:share 1.6s ease-in-out infinite}.electron{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff36a;border:3px solid #fff;box-shadow:0 0 7px #ffea00,0 0 20px #ffcf00;z-index:9}.transfer{animation:transfer 2.3s ease-in-out infinite}.pair1{animation:orbit1 2.2s linear infinite}.pair2{animation:orbit2 2.2s linear infinite}.arrow{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:46px;color:#066f8b;font-weight:900;z-index:8}.charge{position:absolute;top:-13px;left:-9px;background:#fff;color:#0b6d87;border:2px solid currentColor;border-radius:99px;padding:4px 8px;font-size:16px}.pink .charge{color:#bd2348}@keyframes breathe{50%{transform:scale(1.09);opacity:.65}}@keyframes share{50%{transform:translateX(-50%) scaleX(1.14) scaleY(.92)}}@keyframes transfer{0%,18%{left:32%;top:44%}70%,100%{left:66%;top:44%}}@keyframes orbit1{from{transform:translate(-18px,-5px) rotate(0deg) translateX(34px)}to{transform:translate(-18px,-5px) rotate(360deg) translateX(34px)}}@keyframes orbit2{from{transform:translate(18px,5px) rotate(180deg) translateX(34px)}to{transform:translate(18px,5px) rotate(540deg) translateX(34px)}}
.choice{display:grid;gap:9px}.choice button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:start;cursor:pointer;color:var(--ink);font-weight:800}.choice button:hover{border-color:var(--blue)}.choice button.good{background:#ddfaef;border-color:var(--green)}.choice button.bad{background:#ffe5eb;border-color:var(--pink)}.feedback{min-height:48px;margin-top:10px;border-radius:13px;padding:11px 13px;background:#edf7f9;color:var(--muted);line-height:1.6}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:2px solid var(--line);border-radius:99px;padding:8px 12px;background:#fff;cursor:pointer;font-weight:800}.chip.on{background:#dff9ff;border-color:var(--blue)}.sim{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.sample{border:2px solid var(--line);border-radius:17px;padding:14px;text-align:center;background:#fff}.sample strong{display:block;font-size:19px}.meter{height:14px;background:#e3edf0;border-radius:99px;overflow:hidden;margin:11px 0}.meter i{display:block;height:100%;width:7%;background:var(--pink);transition:.5s}.sample.active .meter i{width:92%;background:var(--green)}.bulb{font-size:44px;filter:grayscale(1);transition:.4s}.sample.active .bulb{filter:none;transform:scale(1.13)}.compare{width:100%;border-collapse:collapse}.compare th,.compare td{padding:11px;border-bottom:1px solid var(--line);text-align:center}.compare th{background:#e5f8fc}.quizTop{display:flex;justify-content:space-between;gap:12px}.score{font-size:22px;font-weight:900;color:var(--pink)}.final{display:grid;place-items:center;text-align:center;min-height:440px}.ring{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;position:relative}.ring:after{content:'';position:absolute;width:122px;height:122px;background:#fff;border-radius:50%}.ring b{z-index:2;font-size:34px}.small{font-size:13px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.stage{padding:16px;min-height:650px}.atomScene{gap:72px;height:300px}.cloud.left{left:5%}.cloud.right{right:5%}.sim{grid-template-columns:1fr}.hero p{display:none}}
</style></head>
<body><main class="app"><header class="hero"><div><div class="eyebrow" style="color:#8defff">NEIMA C3 • GRADE 10</div><h1 id="appTitle"></h1><p id="appSub"></p></div><div class="tools"><button class="glass" id="langBtn">English</button><button class="glass" id="soundBtn">🔊</button></div></header><div class="progress"><span id="bar"></span></div><section class="card"><div class="stage" id="stage"></div><footer class="nav"><button id="prev"></button><div class="count" id="count"></div><button id="next"></button></footer></section></main>
<script>
const A={ar:{title:'مختبر الروابط الكيميائية',sub:'الرابطة الأيونية والتساهمية وخصائصهما',prev:'السابق',next:'التالي',station:'الخطوة',try:'اختر إجابتك لتحصل على تغذية راجعة فورية.',correct:'أحسنت! إجابة صحيحة.',wrong:'حاول مرة أخرى. راجع حركة السحابة الإلكترونية.',steps:[['ابدأ الرحلة','ستتعلم كيف تتكوّن الرابطة الأيونية والتساهمية، ثم تربط نوع الرابطة بخصائص المادة.','الإلكترونات لا تتحرك في مسار دائري ثابت؛ تظهر هنا كسحابة تمثل احتمال وجودها حول النواة.'],['الرابطة الأيونية','تنتقل كثافة إلكترونية من ذرة فلز إلى ذرة لافلز، فتتكوّن أيونات مختلفة الشحنة تتجاذب.','شاهد السحابة الصفراء وهي تنتقل من الصوديوم إلى الكلور.'],['تحقق سريع','ماذا يحدث للإلكترونات عند تكوين رابطة أيونية؟','اختر الإجابة الصحيحة.'],['الرابطة التساهمية','تتداخل السحب الإلكترونية، وتصبح كثافة الإلكترونات المشتركة بين النواتين.','الإلكترونان المشتركان يتحركان داخل سحابة جزيئية واحدة.'],['مختبر الخصائص','جرّب العينات في حالات مختلفة. المواد الأيونية توصل الكهرباء عندما تكون منصهرة أو مذابة، لا وهي صلبة.','اضغط على حالة كل عينة وشاهد المصباح.'],['قارن الخصائص','قارن بين نوعي الروابط من حيث الجسيمات ودرجة الانصهار والتوصيل.','استخدم الجدول كدليل قبل الاختبار.'],['سؤال تطبيقي','مادة صلبة هشة، درجة انصهارها مرتفعة، وتوصل الكهرباء عند إذابتها في الماء. ما نوع الرابطة؟','طبّق خصائص الروابط على الدليل التجريبي.'],['الاختبار الختامي','أجب عن خمسة أسئلة. ستظهر النتيجة فورًا في النهاية.','اختر أفضل إجابة لكل سؤال.']],ionic:['تنتقل من ذرة إلى أخرى','تتشارك بين الذرتين','تختفي من الذرة'],apply:['أيونية','تساهمية','فلزية']},en:{title:'Chemical Bond Lab',sub:'Ionic and covalent bonds and their properties',prev:'Previous',next:'Next',station:'Step',try:'Choose an answer for instant feedback.',correct:'Excellent! Correct answer.',wrong:'Try again. Review the electron-cloud motion.',steps:[['Start the journey','Learn how ionic and covalent bonds form, then connect bonding to material properties.','Electrons do not follow fixed circular tracks; the cloud shows the probability of finding them around a nucleus.'],['Ionic bonding','Electron density transfers from a metal atom to a non-metal atom, forming oppositely charged ions that attract.','Watch the yellow cloud move from sodium to chlorine.'],['Quick check','What happens to electrons when an ionic bond forms?','Choose the correct answer.'],['Covalent bonding','Electron clouds overlap, placing shared electron density between the two nuclei.','The shared pair moves inside one molecular cloud.'],['Properties lab','Test samples in different states. Ionic substances conduct when molten or dissolved, but not as solids.','Select a state and watch the lamp.'],['Compare properties','Compare the bonds by particles, melting point, and electrical conductivity.','Use the table as evidence before the quiz.'],['Apply your knowledge','A brittle solid has a high melting point and conducts when dissolved in water. Which bonding is most likely?','Match the evidence to bonding properties.'],['Final quiz','Answer five questions. Your score appears immediately at the end.','Choose the best answer for each question.']],ionic:['They transfer from one atom to another','They are shared between atoms','They disappear from the atom'],apply:['Ionic','Covalent','Metallic']}};
const quiz=[{ar:['لماذا لا يوصل المركب الأيوني الكهرباء وهو صلب؟',['الأيونات ثابتة في مكانها','لا يحتوي على شحنات','الإلكترونات تختفي'],0],en:['Why does a solid ionic compound not conduct electricity?',['Its ions are fixed in place','It has no charges','Its electrons disappear'],0]},{ar:['أي وصف يناسب الرابطة التساهمية؟',['انتقال الإلكترونات','مشاركة كثافة إلكترونية','تجاذب أيونات فقط'],1],en:['Which describes a covalent bond?',['Electron transfer','Shared electron density','Attraction of ions only'],1]},{ar:['أي عينة توصل الكهرباء غالبًا؟',['NaCl الصلب','NaCl المنصهر','السكر الصلب'],1],en:['Which sample usually conducts?',['Solid NaCl','Molten NaCl','Solid sugar'],1]},{ar:['لماذا تكون درجة انصهار المركبات الأيونية مرتفعة؟',['قوى تجاذب كهروستاتيكية قوية','الجزيئات خفيفة','لا توجد شحنات'],0],en:['Why do ionic compounds have high melting points?',['Strong electrostatic attractions','Their molecules are light','They have no charges'],0]},{ar:['في جزيء Cl₂، أين تتركز السحابة المشتركة؟',['بين النواتين','داخل نواة واحدة','بعيدًا عن الذرتين'],0],en:['In Cl₂, where is shared electron density concentrated?',['Between the nuclei','Inside one nucleus','Far from both atoms'],0]}];
let lang='ar',step=0,sound=true,qi=0,score=0,locked=false;const stage=document.getElementById('stage'),bar=document.getElementById('bar'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');function T(){return A[lang]}
function clouds(type){if(type==='ionic')return '<div class="atomScene"><div class="cloud left"></div><div class="cloud right"></div><div class="atom">Na<span class="charge">+</span></div><span class="electron transfer">e⁻</span><div class="arrow">→</div><div class="atom pink">Cl<span class="charge">−</span></div></div>';return '<div class="atomScene"><div class="cloud shared"></div><div class="atom">Cl</div><span class="electron pair1">e⁻</span><span class="electron pair2">e⁻</span><div class="atom pink">Cl</div></div>'}
function shell(body,visual){var s=T().steps[step];stage.innerHTML='<div class="eyebrow">'+T().station+' '+(step+1)+' • EXPLORE</div><h2>'+s[0]+'</h2><p class="lead">'+s[1]+'</p><div class="grid"><div>'+visual+'</div><div class="panel"><h3>'+s[2]+'</h3>'+body+'</div></div>'}
function instant(options,answer){var out='<p class="small">'+T().try+'</p><div class="choice">';options.forEach(function(x,i){out+='<button onclick="checkChoice(this,'+i+','+answer+')">'+x+'</button>'});return out+'</div><div class="feedback" id="fb"></div>'}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';appTitle.textContent=T().title;appSub.textContent=T().sub;langBtn.textContent=lang==='ar'?'English':'العربية';prev.textContent=T().prev;next.textContent=T().next;if(step===0)shell('<div class="callout">'+(lang==='ar'?'الهدف: أفسّر تكوّن الرابطتين وأقارن خصائص المركبات الناتجة.':'Goal: Explain how both bonds form and compare their properties.')+'</div>'+instant(lang==='ar'?['سحابة احتمالية حول النواة','مدار دائري ثابت','الإلكترون داخل النواة']:['A probability cloud around the nucleus','A fixed circular track','An electron inside the nucleus'],0),clouds('covalent'));if(step===1)shell('<div class="callout">'+(lang==='ar'?'بعد الانتقال: Na⁺ فقد كثافة إلكترونية، وCl⁻ اكتسبها. التجاذب بين الشحنتين هو الرابطة الأيونية.':'After transfer: Na⁺ lost electron density and Cl⁻ gained it. Attraction between the charges is the ionic bond.')+'</div>',clouds('ionic'));if(step===2)shell(instant(T().ionic,0),clouds('ionic'));if(step===3)shell('<div class="callout">'+(lang==='ar'?'منطقة التداخل المضيئة تمثل سحابة مشتركة تربط الذرتين معًا.':'The bright overlap represents a shared cloud that holds both atoms together.')+'</div>',clouds('covalent'));if(step===4)lab();if(step===5)compare();if(step===6)shell(instant(T().apply,0),'<div class="panel" style="height:100%;display:grid;place-items:center;text-align:center"><div><div style="font-size:70px">🧂</div><h3>'+(lang==='ar'?'دليل مجهول':'Unknown sample')+'</h3><p>'+(lang==='ar'?'صلب بلوري • هش • انصهار مرتفع • يوصل بعد الذوبان':'Crystalline • brittle • high melting • conducts in solution')+'</p></div></div>');if(step===7)quizScreen();nav()}
function lab(){var s=T().steps[step],solid=lang==='ar'?'صلب':'Solid',molten=lang==='ar'?'منصهر':'Molten',solution=lang==='ar'?'مذاب في الماء':'Dissolved in water',ionic=lang==='ar'?'مركب أيوني':'Ionic compound',cov=lang==='ar'?'مادة تساهمية':'Covalent substance',no=lang==='ar'?'ضعيف أو لا يوصل':'Poor or non-conductor';stage.innerHTML='<div class="eyebrow">'+T().station+' 5 • SIMULATE</div><h2>'+s[0]+'</h2><p class="lead">'+s[1]+'</p><div class="panel"><div class="chips"><button class="chip on" onclick="setState(false,this)">'+solid+'</button><button class="chip" onclick="setState(true,this)">'+molten+'</button><button class="chip" onclick="setState(true,this)">'+solution+'</button></div><div class="sim"><div class="sample" id="ionicSample"><div class="bulb">💡</div><strong>'+ionic+'</strong><div class="meter"><i></i></div><span id="ionicText">'+no+'</span></div><div class="sample"><div class="bulb">💡</div><strong>'+cov+'</strong><div class="meter"><i></i></div><span>'+no+'</span></div><div class="sample"><div style="font-size:44px">🔬</div><strong>'+(lang==='ar'?'الملاحظة':'Observation')+'</strong><p id="observe">'+(lang==='ar'?'الأيونات في الشبكة الصلبة غير حرة الحركة.':'Ions in the solid lattice cannot move freely.')+'</p></div></div></div>'}
function setState(active,el){document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});el.classList.add('on');ionicSample.classList.toggle('active',active);ionicText.textContent=active?(lang==='ar'?'الأيونات تتحرك وتحمل الشحنة':'Moving ions carry charge'):(lang==='ar'?'لا يوصل وهو صلب':'Does not conduct as a solid');observe.textContent=active?(lang==='ar'?'الأيونات أصبحت حرة الحركة، لذلك تحمل الشحنة.':'The ions are free to move and carry charge.'):(lang==='ar'?'الأيونات في الشبكة الصلبة غير حرة الحركة.':'Ions in the solid lattice cannot move freely.');tone(active?620:280)}
function compare(){var s=T().steps[step],ar=lang==='ar';stage.innerHTML='<div class="eyebrow">'+T().station+' 6 • COMPARE</div><h2>'+s[0]+'</h2><p class="lead">'+s[1]+'</p><div class="panel"><table class="compare"><tr><th></th><th>'+(ar?'مركب أيوني':'Ionic compound')+'</th><th>'+(ar?'مادة تساهمية':'Covalent substance')+'</th></tr><tr><th>'+(ar?'الجسيمات':'Particles')+'</th><td>'+(ar?'أيونات موجبة وسالبة':'Positive and negative ions')+'</td><td>'+(ar?'جزيئات':'Molecules')+'</td></tr><tr><th>'+(ar?'درجة الانصهار':'Melting point')+'</th><td>'+(ar?'مرتفعة غالبًا':'Usually high')+'</td><td>'+(ar?'منخفضة غالبًا':'Usually low')+'</td></tr><tr><th>'+(ar?'التوصيل':'Conductivity')+'</th><td>'+(ar?'عند الانصهار أو الذوبان':'When molten or dissolved')+'</td><td>'+(ar?'ضعيف أو لا يوصل':'Poor or non-conductor')+'</td></tr></table></div><div class="callout" style="margin-top:14px">'+(ar?'حركة الجسيمات المشحونة هي مفتاح التوصيل.':'Moving charged particles are the key to conductivity.')+'</div>'}
function checkChoice(btn,pick,answer){btn.parentElement.querySelectorAll('button').forEach(function(x){x.classList.remove('good','bad')});btn.classList.add(pick===answer?'good':'bad');document.getElementById('fb').textContent=pick===answer?T().correct:T().wrong;tone(pick===answer?720:220)}
function quizScreen(){var q=quiz[qi][lang],out='<div class="quizTop"><div><div class="eyebrow">'+T().station+' 8 • '+(qi+1)+'/5</div><h2>'+q[0]+'</h2></div><div class="score">'+score+'/5</div></div><div class="choice">';q[1].forEach(function(x,i){out+='<button onclick="answerQuiz(this,'+i+','+q[2]+')">'+x+'</button>'});stage.innerHTML=out+'</div><div class="feedback" id="fb">'+T().try+'</div>'}
function answerQuiz(btn,pick,answer){if(locked)return;locked=true;btn.parentElement.querySelectorAll('button').forEach(function(x,i){if(i===answer)x.classList.add('good');else if(i===pick)x.classList.add('bad')});if(pick===answer)score++;document.getElementById('fb').textContent=pick===answer?T().correct:T().wrong;tone(pick===answer?760:220);setTimeout(function(){qi++;locked=false;if(qi<5)quizScreen();else result()},700)}
function result(){var ar=lang==='ar',msg=score===5?(ar?'ممتاز! أتقنت الفكرة والخصائص.':'Excellent! You mastered the ideas and properties.'):(ar?'راجع الأدلة ثم حاول مرة أخرى.':'Review the evidence and try again.');stage.innerHTML='<div class="final"><div><div class="ring" style="background:conic-gradient(var(--green) '+score*20+'%,#d9e8ec '+score*20+'%)"><b>'+score+'/5</b></div><h2>'+(ar?'نتيجتك':'Your score')+'</h2><p class="lead">'+msg+'</p><button class="primary" onclick="restart()">'+(ar?'أعد المحاولة':'Try again')+'</button></div></div>';next.style.visibility='hidden'}
function restart(){qi=0;score=0;locked=false;render()}function nav(){bar.style.width=((step+1)/8*100)+'%';prev.disabled=step===0;next.style.visibility=step===7?'hidden':'visible';count.textContent=T().station+' '+(step+1)+' / 8'}function move(d){step=Math.max(0,Math.min(7,step+d));render();tone(440)}function tone(f){if(!sound)return;try{var a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);o.stop(a.currentTime+.13)}catch(e){}}
langBtn.onclick=function(){lang=lang==='ar'?'en':'ar';render()};soundBtn.onclick=function(){sound=!sound;soundBtn.textContent=sound?'🔊':'🔇'};prev.onclick=function(){move(-1)};next.onclick=function(){move(1)};render();
</script></body></html>
